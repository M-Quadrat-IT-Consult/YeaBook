name: Build and Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.1.3 or v0.1.3-dev)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and resolve the release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 .github/scripts/release.py release

  test:
    needs: release
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.release.outputs.sha }}

  docker:
    name: Build and push multi-arch image
    needs: [release, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || '' }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || '' }}
      DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY || vars.DOCKERHUB_REPOSITORY || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Validate registry configuration
        id: registries
        run: python3 .github/scripts/release.py registries

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registries.outputs.docker_enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.registries.outputs.ghcr_image }}
            ${{ steps.registries.outputs.docker_image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.release.outputs.latest }}
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/386,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.release.outputs.tag }}
          cache-from: type=gha,scope=yeabook-release
          cache-to: type=gha,scope=yeabook-release,mode=max
